name: Build Leo's Cafe package
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check source
        run: npm run check
      - name: Test order and reward flows
        run: npm test
      - name: Create runnable server and PWA ZIP
        run: |
          zip -qr leos-cafe-build.zip public server.js package.json README.md .gitignore .github test -x 'data/*' '.env' 'node_modules/*'
          unzip -t leos-cafe-build.zip | tail -1
      - name: Attach build to workflow
        uses: actions/upload-artifact@v4
        with:
          name: leos-cafe-build
          path: leos-cafe-build.zip
          if-no-files-found: error
          retention-days: 30
  android:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK platform
        run: |
          SDKMANAGER=$(find "$ANDROID_HOME/cmdline-tools" -type f -name sdkmanager | head -1)
          "$SDKMANAGER" 'platforms;android-35' 'build-tools;34.0.0'
      - name: Build installable debug APK
        run: gradle -p android :app:assembleDebug --no-daemon
      - name: Name APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk leos-cafe-debug.apk
      - name: Attach Android APK
        uses: actions/upload-artifact@v4
        with:
          name: leos-cafe-android-apk
          path: leos-cafe-debug.apk
          if-no-files-found: error
          retention-days: 30
